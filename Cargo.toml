[package]
name = "vmpl-run"
version = "0.1.2"
edition = "2021"
authors = ["Benshan Mei <mbs2021@163.com>"]
description = "A tool to run programs with VMPL support"
license = "MIT"
repository = "https://github.com/vmpl-dev/vmpl-run"
documentation = "https://docs.rs/vmpl-run"
readme = "README.md"
keywords = ["sev-snp", "vmpl", "security", "isolation", "virtualization"]
categories = ["command-line-utilities", "virtualization"]

# published to crates.io
publish = true

[dependencies]
structopt = { version = "0.3.26", features = ["color", "wrap_help", "doc", "paw", "suggestions", "yaml"] }
libc = "0.2"
which = "7.0.1"
rustyline = "9.1"
lazy_static = "1.5.0"

[features]
default = []
hotcalls = []

[package.metadata.deb]
maintainer = "Benshan Mei <mbs2021@163.com>"
copyright = "2024, Benshan Mei"
license-file = ["LICENSE", "4"]
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    # 二进制文件
    ["target/release/vmpl-run", "usr/bin/", "755"],
    
    # 文档
    ["README.md", "usr/share/doc/vmpl-run/README", "644"],
]
maintainer-scripts = "debian/"
systemd-units = { enable = false }
conf-files = []
extended-description = """
A tool to run programs with VMPL support.
Provides VMPL process and thread isolation capabilities.
"""
